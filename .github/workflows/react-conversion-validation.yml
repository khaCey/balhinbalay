name: React conversion validation

on:
  push:
    branches:
      - feature/react-prototype-ui
  pull_request:
    branches:
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand

      - name: Build
        env:
          CI: 'false'
        run: npm run build
