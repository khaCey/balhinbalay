name: WRK0024 Upgrade Nodemailer

on:
  push:
    branches:
      - wrk0024-nodemailer-10

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Upgrade Nodemailer only
        working-directory: account-service
        run: npm install nodemailer@10.0.10 --save --save-exact
      - name: Show dependency diff
        run: git diff -- account-service/package.json account-service/package-lock.json
      - name: Production audit must have no high or critical findings
        working-directory: account-service
        run: npm audit --omit=dev --audit-level=high
      - name: Account-service tests
        working-directory: account-service
        run: npm test
      - name: Install Site dependencies
        run: pnpm install --frozen-lockfile
      - name: Site automated tests
        run: node --test tests/*.test.mjs
      - name: Site lint
        run: pnpm lint
      - name: Site build
        run: pnpm build
      - name: Diff sanity
        run: git diff --check
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account-service/package.json account-service/package-lock.json
          git commit -m "Upgrade Nodemailer to 10.0.10"
          git push origin HEAD:wrk0024-nodemailer-10
