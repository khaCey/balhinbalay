name: Apply owner map privacy guard

on:
  push:
    branches:
      - feature/react-prototype-ui
    paths:
      - 'scripts/apply-owner-map-privacy-guard.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/react-prototype-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply privacy guard
        run: node scripts/apply-owner-map-privacy-guard.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AddPropertyForm.js scripts/capture-owner-form-visual-qa.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Hide unsupported exact map-pin input"
          git push origin HEAD:feature/react-prototype-ui
