name: WRK0071 integrated MVP verification
on:
  pull_request:
    branches: [server]
    paths-ignore: ["docs/**"]
  push:
    branches: [codex/wrk0071-integrated-mvp]
    paths-ignore: ["docs/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-media-verification-only
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      BB_MARKETPLACE_TEST_URL: postgresql://postgres:disposable-media-verification-only@127.0.0.1:55432/postgres
      BB_MARKETPLACE_DISPOSABLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Frozen account dependencies
        working-directory: account-service
        run: npm ci
      - name: Account regression and image processing
        working-directory: account-service
        run: npm test
      - name: All real PostgreSQL/PostGIS integration and historical backup regression
        working-directory: account-service
        env:
          BB_MARKETPLACE_PG_CONTAINER: ${{ job.services.postgis.id }}
        run: node --test --test-concurrency=2 test/integration/*.test.js
      - name: Combined calendar, reporting, publication and photo boundaries across timezones
        working-directory: account-service
        run: |
          for zone in UTC Asia/Tokyo America/New_York; do
            TZ="$zone" node --test --test-concurrency=1 test/integration/calendar-dates.test.js test/integration/publication.test.js test/integration/reporting.test.js test/integration/media.test.js
          done
      - name: Frozen Site dependencies with existing release-age policy
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Site regression
        run: node --test tests/*.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
      - name: Actual initial HTML for social crawlers and withdrawal
        run: node scripts/verify-listing-sharing.mjs
      - name: Isolated pinned browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/bb-media-browser" --ignore-scripts --no-audit --no-fund --package-lock=false --no-save playwright@1.62.1
          node "$RUNNER_TEMP/bb-media-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Mobile and desktop photo controls in Chromium
        env:
          BB_PLAYWRIGHT_MODULE: ${{ runner.temp }}/bb-media-browser/node_modules/playwright/index.mjs
        run: node scripts/verify-listing-sharing.mjs --browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrk0071-listing-media-browser
          path: .sites-runtime/media-browser/
          if-no-files-found: ignore
      - name: Source integrity
        run: |
          git diff --exit-code
          git diff --check
          sha256sum account-service/migrations/*.sql
      - name: Production audits
        run: |
          pnpm audit --prod --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix account-service
