name: Patch visual QA fixtures

on:
  push:
    branches:
      - feature/react-prototype-ui
    paths:
      - 'scripts/patch-visual-qa-fixtures.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/react-prototype-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch visual QA fixture coverage
        run: node scripts/patch-visual-qa-fixtures.mjs
      - name: Commit patched QA harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-react-visual-qa.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Improve visual QA parity fixtures"
          git push origin HEAD:feature/react-prototype-ui
