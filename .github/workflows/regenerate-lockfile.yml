name: Regenerate package lockfile

on:
  push:
    branches:
      - feature/react-prototype-ui
    paths:
      - '.github/lockfile-regeneration-trigger'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/react-prototype-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate package lockfile"
          git push origin HEAD:feature/react-prototype-ui
