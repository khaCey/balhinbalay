name: Apply privacy and chat parity

on:
  push:
    branches:
      - feature/react-prototype-ui
    paths:
      - 'scripts/apply-privacy-chat-parity.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/react-prototype-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply privacy and messaging parity patch
        run: node scripts/apply-privacy-chat-parity.mjs
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PropertyDetailContent.js src/pages/ChatPage.js src/pages/MessagesPage.js src/styles/chat-owner-parity.css src/styles/saved-messages-parity.css
          git diff --cached --quiet && exit 0
          git commit -m "Align privacy-safe detail and messaging parity"
          git push origin HEAD:feature/react-prototype-ui
