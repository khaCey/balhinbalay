name: Live API smoke once

on:
  push:
    branches:
      - feature/react-prototype-ui
    paths:
      - '.github/workflows/live-api-smoke-once.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose public endpoint availability
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local url="$1"
            local body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 30 \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "URL: $url"
            echo "HTTP: ${status:-curl-error}"
            grep -iE '^(server|cf-ray|location|content-type):' "$headers" | tail -n 10 || true
            echo 'Body preview:'
            head -c 500 "$body" | tr '\n' ' ' || true
            echo
            echo '---'
            rm -f "$body" "$headers"
          }

          probe 'https://balhinbalay.com/'
          probe 'https://balhinbalay.com/api/health'
          probe 'https://balhinbalay.com/api'
          probe 'https://www.balhinbalay.com/'

          health_status="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' 'https://balhinbalay.com/api/health' || true)"
          if [ "$health_status" != '200' ]; then
            echo "Live API unavailable: /api/health returned ${health_status:-curl-error}."
            exit 1
          fi
