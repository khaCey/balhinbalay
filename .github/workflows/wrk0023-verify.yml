name: WRK0023 Verify

on:
  push:
    branches:
      - wrk0023-remove-stale-consumer-admin-test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install Site dependencies
        run: pnpm install --frozen-lockfile
      - name: Site automated tests
        run: node --test tests/*.test.mjs
      - name: Site lint
        run: pnpm lint
      - name: Site build
        run: pnpm build
      - name: Install account-service dependencies
        working-directory: account-service
        run: npm ci
      - name: Account-service tests
        working-directory: account-service
        run: npm test
      - name: Diff sanity
        run: git diff --check
