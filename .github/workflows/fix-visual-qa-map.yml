name: Fix visual QA map navigation

on:
  push:
    branches:
      - feature/react-prototype-ui
    paths:
      - 'scripts/fix-visual-qa-map.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/react-prototype-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch visual QA navigation
        run: node scripts/fix-visual-qa-map.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-react-visual-qa.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Make visual QA map capture viewport independent"
          git push origin HEAD:feature/react-prototype-ui
