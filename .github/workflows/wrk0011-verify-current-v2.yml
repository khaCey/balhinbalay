name: WRK0011 Verify Current Baseline V2

on:
  push:
    branches:
      - wrk0011-verify-current-v2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Verify checkout baseline
        run: |
          test "$(git rev-parse HEAD^)" = "7620dd845ff0817ab7c6193656b8fcb8f2a69453"
          git diff --check HEAD^ HEAD
      - name: Install Site dependencies
        run: pnpm install --frozen-lockfile
      - name: Site automated tests
        run: node --test tests/*.test.mjs
      - name: Site lint
        run: pnpm lint
      - name: Site build
        run: pnpm build
      - name: Install account-service dependencies
        working-directory: account-service
        run: npm ci
      - name: Account-service tests
        working-directory: account-service
        run: npm test
      - name: Working-tree sanity
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          git status --short --branch
