name: WRK0025 Verify

on:
  push:
    branches:
      - wrk0025-auth-reset-ux

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Verify WRK0025 base ancestry and diff
        run: |
          git merge-base --is-ancestor e318c6f78fd093f96e9cd130ead79a43ef6abed3 HEAD
          git diff --check e318c6f78fd093f96e9cd130ead79a43ef6abed3 HEAD
      - name: Install Site dependencies
        run: pnpm install --frozen-lockfile
      - name: Site automated tests
        run: node --test tests/*.test.mjs
      - name: Site lint
        run: pnpm lint
      - name: Site production build
        run: pnpm build
      - name: Install account-service dependencies
        working-directory: account-service
        run: npm ci
      - name: Account-service production audit
        working-directory: account-service
        run: npm audit --omit=dev --audit-level=high
      - name: Account-service tests
        working-directory: account-service
        run: npm test
      - name: Working-tree sanity
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          git status --short --branch
